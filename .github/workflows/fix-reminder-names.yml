name: Temporary fix reminder keyboard names
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix two function calls and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          old = 'create_remind_time_keyboard(user_id)'
          new = 'create_reminder_time_keyboard(user_id)'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 replacements, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-reminder-names.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py .github/workflows/fix-reminder-names.yml
          git commit -m 'Fix reminder time keyboard function calls'
          git push
