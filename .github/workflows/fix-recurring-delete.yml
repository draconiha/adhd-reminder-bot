name: Fix recurring task deletion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply patch
        run: python tools/fix_recurring_delete.py

      - name: Check syntax
        run: python -m compileall -q .

      - name: Commit patched bot and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm -f .github/workflows/fix-recurring-delete.yml tools/fix_recurring_delete.py
          git commit -m "Fix recurring task deletion [skip ci]"
          git push
