name: Fix recurring UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert recurring details helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          marker = 'def create_confirm_delete_all_recurring_keyboard():'

          helper = '''def create_recurring_details_keyboard(task_id):
    markup = types.InlineKeyboardMarkup(row_width=2)
    markup.add(
        types.InlineKeyboardButton(
            "🗑️ Удалить",
            callback_data=f"delete_recurring_{task_id}"
        ),
        types.InlineKeyboardButton(
            "◀️ К списку",
            callback_data="recurring_list"
        )
    )
    return markup


def show_recurring_details(user_id, task_id, message_id=None):
    tasks = get_recurring_tasks(user_id)
    task = next((task for task in tasks if task[0] == task_id), None)

    if not task:
        text = "❌ Повторяющееся дело не найдено."
        if message_id:
            bot.edit_message_text(text, user_id, message_id)
        else:
            bot.send_message(user_id, text)
        return

    (
        _, task_text, recurrence_type, recurrence_days_json,
        reminder_time, remind_before, start_date, end_date, is_active
    ) = task

    recurrence_names = {
        "daily": "каждый день",
        "weekdays": "по будням",
        "weekends": "по выходным",
        "weekly": "еженедельно",
        "monthly": "ежемесячно",
        "none": "без повтора"
    }
    recurrence_text = recurrence_names.get(recurrence_type, recurrence_type)

    try:
        days = json.loads(recurrence_days_json) if recurrence_days_json else []
    except Exception:
        days = []

    if recurrence_type == "weekly" and days:
        names = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"]
        selected_names = [
            names[d] for d in days
            if isinstance(d, int) and 0 <= d <= 6
        ]
        if selected_names:
            recurrence_text += ": " + ", ".join(selected_names)
    elif recurrence_type == "monthly" and days:
        recurrence_text += ": " + ", ".join(map(str, days))

    start_text = format_date(start_date) if start_date else "не указано"
    end_text = format_date(end_date) if end_date else "без ограничения"

    if reminder_time and reminder_time != "None":
        reminder_text = reminder_time
        if remind_before:
            if remind_before < 60:
                reminder_text += f" (за {remind_before} мин)"
            elif remind_before == 60:
                reminder_text += " (за 1 час)"
            elif remind_before == 120:
                reminder_text += " (за 2 часа)"
            elif remind_before == 1440:
                reminder_text += " (за день)"
    else:
        reminder_text = "без напоминания"

    status_text = "активно" if is_active else "выключено"

    text = (
        f"🔄 <b>{task_text}</b>\\n\\n"
        f"📅 Начало: {start_text}\\n"
        f"📅 До: {end_text}\\n"
        f"🔁 Повтор: {recurrence_text}\\n"
        f"⏰ Время: {reminder_text}\\n"
        f"📌 Статус: {status_text}"
    )

    markup = create_recurring_details_keyboard(task_id)

    if message_id:
        bot.edit_message_text(
            text,
            user_id,
            message_id,
            parse_mode="HTML",
            reply_markup=markup
        )
    else:
        bot.send_message(
            user_id,
            text,
            parse_mode="HTML",
            reply_markup=markup
        )


'''

          if 'def show_recurring_details(' not in text:
              if marker not in text:
                  raise SystemExit(f'Marker not found: {marker}')
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          print('Recurring details helpers installed')
          PY

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Fix recurring task details helper [skip ci]" || exit 0
          git push

      - name: Remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-recurring-ui.yml
          git commit -m "Remove temporary recurring UI workflow [skip ci]" || exit 0
          git push
